<!doctype html>
<html lang="ru">
<head>

<title>Оплата принята — Бастион Рассвета</title>
<style>
:root{--bg:#fbf8f3;--fg:#241c16;--muted:#6b5d50;--accent:#8a4b12}

body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{padding:1.5rem;max-width:30rem}
h1{font-size:1.6rem;margin:0 0 .75rem;color:var(--accent)}
p{margin:.4rem 0}.muted{color:var(--muted);font-size:.95rem}

</head>
<body>
<main>
<h1>Оплата принята</h1>
<p>Вернитесь в игру — покупка придёт автоматически, обычно в течение нескольких секунд.</p>
<p class="muted">Если ничего не изменилось, откройте игру заново: оплаченное будет выдано при запуске.</p>
</main>
</body>
</html>
